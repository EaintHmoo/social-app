services:
  app:
    build: .
    container_name: my-app-api
    restart: unless-stopped
    # Wait until postgres actually accepts connections, not just until its container exists —
    # otherwise the startup migration and prisma.$connect() race the database and the app exits.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      # Inside the compose network the database is "postgres", never 127.0.0.1 —
      # localhost in a container means the container itself. This overrides DATABASE_URL
      # from .env, since dotenv does not overwrite variables already in the environment.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      JWT_SESSION_MAX_LIFETIME: ${JWT_SESSION_MAX_LIFETIME}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      ASSET_BASE_URL: ${ASSET_BASE_URL}
      TZ: UTC
    volumes:
      # Your source, live-mounted: edit a file on the host and nodemon restarts inside.
      - .:/app
      # Keeps the container's own node_modules (installed for Linux) from being
      # hidden by the host folder mounted above.
      - /app/node_modules

  postgres:
    image: postgres:18
    container_name: my-app-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # No separate GUI container needed: `npm run db:studio` opens Prisma Studio in the browser
  # (Laravel: like TablePlus/Adminer), reading DATABASE_URL from .env.

volumes:
  postgres-data: